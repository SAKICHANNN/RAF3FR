[workspace]
members = ["raf3fr-core", "raf3fr-cli", "raf3fr-jni"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jni = "=0.22.4"
md5 = "0.8"
rawler = { version = "=0.7.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
