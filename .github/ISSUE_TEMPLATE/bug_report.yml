name: Bug report
description: Report a reproducible RAF / 3FR problem without uploading camera originals.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Android, Web, CLI]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.9.5
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: Remove serial numbers, GPS, names and local paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not attach RAW/3FR files or personal metadata.
          required: true
